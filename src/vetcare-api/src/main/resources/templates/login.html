<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — VetCare Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3a8a 0%, #065f46 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 440px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
<div class="card login-card p-4 bg-white">
    <div class="text-center mb-4">
        <h2 class="text-primary fw-bold"><i class="fa-solid fa-paw me-2"></i>VetCare Pro</h2>
        <p class="text-muted">Hệ thống Quản lý Phòng khám Thú y</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
    <div th:if="${logoutMessage}" class="alert alert-success py-2 small" th:text="${logoutMessage}"></div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Tên đăng nhập hoặc Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                <input type="text" name="username" class="form-control" placeholder="admin, dr_minh, recep_hoa..." required autofocus>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary py-2 fw-semibold">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Đăng nhập hệ thống
            </button>
        </div>
    </form>

    <div class="mt-4 p-3 bg-light rounded small">
        <div class="fw-bold mb-1 text-secondary">Tài khoản demo sẵn sàng:</div>
        <div><strong>Bác sĩ:</strong> <code>dr_minh</code> / <code>password123</code></div>
        <div><strong>Lễ tân:</strong> <code>recep_hoa</code> / <code>password123</code></div>
        <div><strong>Admin:</strong> <code>admin</code> / <code>password123</code></div>
    </div>
</div>
</body>
</html>
