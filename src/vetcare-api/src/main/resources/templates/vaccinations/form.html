<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ghi Nhận Tiêm Phòng — VetCare Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 680px;">
    <div class="card border-0 shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-syringe me-2"></i> Ghi Nhận Tiêm Chủng Vaccine</h4>
            <a th:href="@{/vaccinations}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
        </div>

        <form th:action="@{/vaccinations}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Thú cưng được tiêm *</label>
                <select name="petId" class="form-select" required>
                    <option value="">-- Chọn thú cưng --</option>
                    <option th:each="pet : ${pets}" 
                            th:value="${pet.id}" 
                            th:text="${pet.name} + ' (' + ${pet.species} + ' - Chủ: ' + ${pet.owner.fullName} + ')'"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Loại Vaccine tiêm *</label>
                <select name="vaccineId" class="form-select" required>
                    <option value="">-- Chọn loại vaccine --</option>
                    <option th:each="vac : ${vaccines}" 
                            th:value="${vac.id}" 
                            th:text="${vac.name} + ' (' + ${vac.manufacturer} + ' - Cách liều: ' + ${vac.intervalDays} + ' ngày)'"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Bác sĩ thực hiện *</label>
                <select name="vetId" class="form-select" required>
                    <option value="">-- Chọn bác sĩ thú y --</option>
                    <option th:each="vet : ${vets}" 
                            th:value="${vet.id}" 
                            th:text="${vet.fullName}"></option>
                </select>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Số lô sản xuất (Batch No.) *</label>
                    <input type="text" name="batchNumber" class="form-control" placeholder="vd: LOT-RAB-2026" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Ngày tiêm thực tế *</label>
                    <input type="date" name="adminDate" class="form-control" required />
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Ghi chú & Theo dõi sau tiêm</label>
                <textarea name="notes" class="form-control" rows="2" placeholder="Tình trạng thú cưng sau 30 phút theo dõi tại phòng khám..."></textarea>
            </div>

            <div class="d-flex justify-content-end mt-4">
                <a th:href="@{/vaccinations}" class="btn btn-light me-2">Hủy</a>
                <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-save me-1"></i> Lưu sổ tiêm</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
