<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt Lịch Hẹn — VetCare Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 680px;">
    <div class="card border-0 shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-calendar-plus me-2"></i> Đặt Lịch Hẹn Khám Bệnh</h4>
            <a th:href="@{/appointments}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
        </div>

        <form th:action="@{/appointments}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Chọn thú cưng (Bệnh nhân) *</label>
                <select name="petId" class="form-select" required>
                    <option value="">-- Chọn thú cưng --</option>
                    <option th:each="pet : ${pets}" 
                            th:value="${pet.id}" 
                            th:text="${pet.name} + ' (' + ${pet.species} + ' - Chủ: ' + ${pet.owner.fullName} + ')'"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Bác sĩ phụ trách *</label>
                <select name="vetId" class="form-select" required>
                    <option value="">-- Chọn bác sĩ thú y --</option>
                    <option th:each="vet : ${vets}" 
                            th:value="${vet.id}" 
                            th:text="${vet.fullName} + ' (' + ${vet.specialization} + ')'"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Thời gian hẹn khám *</label>
                <input type="datetime-local" name="scheduledAt" class="form-control" required />
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Lý do thăm khám *</label>
                <textarea name="reason" class="form-control" rows="3" placeholder="Mô tả triệu chứng hoặc nhu cầu (tiêm phòng, tái khám, nôn ói...)" required></textarea>
            </div>

            <div class="d-flex justify-content-end mt-4">
                <a th:href="@{/appointments}" class="btn btn-light me-2">Hủy</a>
                <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-check me-1"></i> Xác nhận đặt lịch</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
